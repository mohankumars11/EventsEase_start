apply plugin: 'com.android.application'

android {
    /* ── One native project, two apps ──────────────────────────────────
     *
     * `npx cap add android` bakes a single applicationId into this file,
     * so building both apps would mean two copies of the whole native
     * project — 3.2 MB duplicated, and every native change made twice
     * with one of them eventually forgotten.
     *
     * Product flavours are Android's own answer. `namespace` stays fixed
     * (it is the Java package the generated sources live in); the
     * applicationId — what Play Store treats as the app's identity —
     * comes from the flavour.
     *
     *   ./gradlew assembleCustomerRelease
     *   ./gradlew assemblePartnerRelease
     *
     * Each flavour has its own source set for google-services.json,
     * because FCM keys the config to the applicationId and one file
     * cannot serve both. */
    namespace = "com.sambramo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // No applicationId here — the flavour supplies it. Leaving one
        // would make it the default and silently win for any build that
        // forgot to name a flavour.
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* ---- Every build is a different version, and says so ---------
           This was a hardcoded `versionCode 1` / `versionName "1.0"` on
           every apk ever produced here. Three consequences, all of which
           bit:

             - Android has no way to tell one build from the next, so
               Settings > Apps > Sambramo Partners reads "1.0" whether
               the apk is from today or from three weeks ago. There was
               no way for anybody to check which one was installed.
             - The package installer treats a same-versionCode apk as a
               reinstall rather than an upgrade, which on some launchers
               and file managers silently does nothing at all.
             - Play Store refuses a second upload at the same
               versionCode outright, so this would have blocked the
               launch regardless.

           `version.json` is written by scripts/write-version.mjs at web
           build time and copied into the apk. Reading its timestamp here
           makes the native version and the web bundle the same fact,
           rather than two that can drift.

           Minutes since 2026-01-01: monotonic, fits comfortably inside
           the 2100000000 ceiling Play enforces, and readable as a date
           by anybody who needs to. */
        def buildStamp = { ->
            def f = file("../../dist/version.json")
            if (!f.exists()) return null
            def m = f.text =~ /"builtAt"\s*:\s*"([^"]+)"/
            return m ? m[0][1] : null
        }()

        if (buildStamp != null) {
            def built = java.time.Instant.parse(buildStamp)
            def epoch = java.time.Instant.parse("2026-01-01T00:00:00Z")
            versionCode ((int) java.time.Duration.between(epoch, built).toMinutes())
            versionName built.atZone(java.time.ZoneId.of("Asia/Kolkata"))
                .format(java.time.format.DateTimeFormatter.ofPattern("yyyy.MM.dd-HHmm"))
        } else {
            /* No web build beside us. Better to fail loudly at install
               time than to ship another apk claiming to be 1.0. */
            versionCode 1
            versionName "0.0-no-web-build"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "audience"

    productFlavors {
        customer {
            dimension "audience"
            applicationId "com.sambramo.app"
            // Read by MainActivity to point the WebView at the right host.
            buildConfigField "String", "SITE_URL", '"https://sambramoh.vercel.app"'
        }
        partner {
            dimension "audience"
            applicationId "com.sambramo.partner"
            buildConfigField "String", "SITE_URL", '"https://sambramo-partners.vercel.app"'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The BoM pins every Firebase library to one compatible set, so a
    // version bump cannot leave messaging and analytics disagreeing.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    /* Razorpay's own Android checkout.

       The JS checkout in the WebView will not offer UPI -- it declines
       an app-switch it cannot guarantee returning from, which inside a
       WebView is correct. This SDK owns the switch: it starts PhonePe or
       GPay as a real activity and gets the result through the activity
       lifecycle. It is what every Indian app you would compare this to
       is using. */
    implementation 'com.razorpay:checkout:1.6.41'

    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
