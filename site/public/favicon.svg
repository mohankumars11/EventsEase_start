<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sambramo">
  <!-- Amethyst, not the aqua ramp the app's favicon still uses. #2A085C is
       the current identity colour (src/index.css .brand-amethyst, and
       android colors.xml colorPrimary); the aqua favicon predates the move
       and is out of step with everything else. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A0F7A"/>
      <stop offset="1" stop-color="#1B0240"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- The saffron pulli — the dot at the centre of the kolam, and the same
       mark that separates the two halves of the tagline in the logo lockup. -->
  <circle cx="47" cy="17" r="4.5" fill="#FBBF24"/>
  <text x="32" y="45" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="38" font-weight="900" letter-spacing="-1">S</text>
</svg>
