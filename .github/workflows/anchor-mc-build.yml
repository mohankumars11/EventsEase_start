name: Anchor MC build
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/partner/AnchorMcTradeSetup.jsx'
      - 'src/App.jsx'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
