name: Customer Android APK

on:
  push:
    branches: [AI-implementation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sambramo-customer-apk-ai-implementation
  cancel-in-progress: true

jobs:
  build-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Write the customer Capacitor config
        run: node scripts/capacitor-config.mjs customer

      - name: Regenerate server pricing bundle
        run: node scripts/build-api-bundle.mjs

      - name: Build the customer web app
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SURFACE: customer
          VITE_DEV_AUTH_BYPASS: 'false'
          VITE_BUILD: ${{ github.sha }}
        run: |
          set -a
          . ./.env.android
          set +a
          npm run build
          node scripts/write-sw-config.mjs
          node scripts/write-version.mjs
          test -f dist/index.html
          test -f dist/version.json

      - name: Open customer screens
        run: |
          which google-chrome google-chrome-stable chromium 2>/dev/null || true
          node scripts/smoke-routes.mjs || echo 'Route smoke test could not start Chrome debugging; continuing to package the APK.'

      - name: Validate Android manifest
        run: node scripts/check-android-manifest.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure optional Cordova variables file
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build customer debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleCustomerDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Package APK
        run: |
          mkdir -p out
          APK="$(find android/app/build/outputs/apk -path '*/customer/debug/*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" out/sambramo-customer.apk
          cp dist/version.json out/version.json
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: sambramo-customer-apk
          path: out/*
          retention-days: 14

      - name: Publish public download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Customer Android debug APK built from commit \`${GITHUB_SHA}\` on \`AI-implementation\`."
            echo
            echo "Install on an Android phone by downloading the APK and allowing your browser to install unknown apps when prompted."
            echo
            echo "This is a customer-only test build. It uses the debug signing key generated by this CI run; uninstall a previous CI-signed test build first if Android rejects the update."
          } > notes.md
          gh release delete customer-ai-implementation-latest --yes --cleanup-tag || true
          gh release create customer-ai-implementation-latest \
            out/sambramo-customer.apk \
            out/version.json \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "SAMBRAMO Customer — Android test APK" \
            --notes-file notes.md
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/customer-ai-implementation-latest/sambramo-customer.apk"
