name: Sambramo Partner Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/sambramo-partner-expo-migration]
    paths:
      - 'apps/partner-native/**'
      - '.github/workflows/partner-native-android.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/partner-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-36,build-tools;36.0.0'
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --non-interactive
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sambramo-partner-native-debug-apk
          path: apps/partner-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
