name: Android APKs

# ══════════════════════════════════════════════════════════════════════
# WHY THIS BUILDS ON CI AND NOT ON THE DEV MACHINE
# ══════════════════════════════════════════════════════════════════════
#
# The Android SDK is a ~3 GB install, the Android Gradle Plugin needs
# JDK 17 or 21 (the dev box has 22, which AGP rejects), and a Gradle
# build wants more memory than a 3.9 GB machine has spare while Vite is
# also running. Every one of those is free on a GitHub runner.
#
# ══════════════════════════════════════════════════════════════════════
# NO SECRETS, AND NO WEB BUILD
# ══════════════════════════════════════════════════════════════════════
#
# capacitor.config.json sets `server.url` to the live site, so the APK is
# a native shell around a hosted web app. That means this workflow never
# needs VITE_SUPABASE_URL, the Firebase config, or any other secret — it
# compiles Java and packages a WebView.
#
# It also means a deploy to Vercel reaches every installed phone
# immediately. A new APK is only needed when something NATIVE changes:
# push configuration, permissions, a plugin, the icon.
#
# ══════════════════════════════════════════════════════════════════════
# DEBUG, DELIBERATELY
# ══════════════════════════════════════════════════════════════════════
#
# A debug APK installs straight onto a phone from a downloaded file and
# needs no keystore. A release AAB needs an upload key that must never
# touch this repository — see the `release` job, which is here as a
# skeleton and stays disabled until that key exists in GitHub Secrets.
#
# Debug builds get real native push. The FCM registration is keyed to
# the applicationId and the google-services.json in the repo, and both
# are the same for debug and release.

on:
  workflow_dispatch:          # the button. This is how you get an APK.
  push:
    branches: [feature/without-shopping]
    # Only when something that affects the native shell changes. A copy
    # edit in a React component does not need a new APK -- the phone
    # picks it up from the live site on next launch.
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/capacitor-config.mjs'
      - 'package.json'
      - '.github/workflows/android.yml'

# The release job writes to the repo. Declared once, at the top, and
# scoped to nothing else — the default token can read everything, and
# broadening it further is not needed to attach two files.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Both apps, independently, so a failure in one still yields the
      # other. `fail-fast: false` matters here: the partner APK is the
      # one being waited on and it must not be cancelled because the
      # customer flavour tripped.
      fail-fast: false
      matrix:
        flavour: [customer, partner]

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 22. AGP 8.x refuses 22 outright.
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          # 22, and it is not a preference. @capacitor/cli 8.5 declares
          # engines.node >= 22.0.0, so `npx cap sync` refuses to run on
          # 20 -- which is why it worked on the dev machine (Node 24) and
          # failed on every runner.
          node-version: '22'
          cache: npm

      # ══════════════════════════════════════════════════════════════
      # One command per step, deliberately
      # ══════════════════════════════════════════════════════════════
      #
      # These four used to be one step, and when it failed the only
      # thing visible without admin rights on the repo was the step
      # NAME — which named four commands. Job logs need admin auth to
      # download; step names and conclusions do not.
      #
      # So each command is its own step. A failure now says which one,
      # to anybody who can see the run at all.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Write the Capacitor config
        run: node scripts/capacitor-config.mjs ${{ matrix.flavour }}

      # `cap sync` runs `cap copy`, which copies webDir into the Android
      # assets folder and FAILS if that folder does not exist. dist/ is
      # gitignored, so a fresh checkout has nothing there.
      #
      # A stub rather than a real `vite build`: capacitor.config.json
      # sets server.url to the live site, so the WebView never loads
      # these files, and building them would mean putting every VITE_
      # secret into this repository to produce assets nothing reads.
      #
      # Not blank on purpose. If server.url is ever removed and somebody
      # forgets this step exists, the app opens on a sentence saying so
      # rather than on white.
      - name: Stub the web assets
        run: |
          mkdir -p dist
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><title>Sambramo</title>' \
            '<body style="font-family:system-ui;padding:2rem;text-align:center">' \
            '<p>This shell loads Sambramo from the web.</p>' \
            '<p>If you are reading this, the app could not reach the site.</p>' \
            > dist/index.html
          ls -l dist/

      # Copies the plugins' native code into the Android project. Without
      # it @capacitor/push-notifications is a JS package with no Android
      # side and the app registers nothing — which is exactly the state
      # that produced "no notifications are coming".
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            assemble${{ matrix.flavour == 'customer' && 'Customer' || 'Partner' }}Debug \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g"

      # Gradle's default output hides the real cause behind "Execution
      # failed for task". This prints it when something breaks, so a
      # failed run is diagnosable from the log rather than by guessing.
      - name: What went wrong
        if: failure()
        working-directory: android
        run: |
          ./gradlew assemble${{ matrix.flavour == 'customer' && 'Customer' || 'Partner' }}Debug \
            --no-daemon --info --stacktrace 2>&1 | tail -120 || true

      - name: Name it something a person can read
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" \
             "out/sambramo-${{ matrix.flavour }}.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: sambramo-${{ matrix.flavour }}-apk
          path: out/*.apk
          # Long enough to install on a few phones, short enough that
          # stale builds do not accumulate and get installed by mistake.
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════
  # A link that can actually be tapped
  # ══════════════════════════════════════════════════════════════════
  #
  # Workflow ARTIFACTS require the person downloading them to be signed
  # in to GitHub — including on a public repository — and the download
  # control is frequently inert on a phone browser. So the one place the
  # APK was published was the one place it could not be installed from.
  #
  # Release assets have none of that. They are plain URLs, they work
  # signed out, and tapping one on Android hands the file straight to the
  # package installer:
  #
  #   https://github.com/<owner>/<repo>/releases/download/android-latest/sambramo-partner.apk
  #
  # ── One rolling tag, not one per build ────────────────────────────
  # `android-latest` is deleted and recreated every run, so the URL above
  # never changes and can be sent to a partner once. Versioned releases
  # are what the Play Store track is for; this is a test build, and a
  # test build that needs a new link every time is a support burden.
  release:
    needs: build
    runs-on: ubuntu-latest
    # Only when both flavours built. A release carrying one of the two
    # apps is worse than no release: somebody installs the partner app,
    # looks for the customer one, and finds a stale copy from days ago.
    if: success()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: What is being published
        run: ls -lh apks/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deleted first so the tag moves. `gh release create` refuses
          # to overwrite, and an --edit path would leave the old assets
          # attached alongside the new ones.
          gh release delete android-latest --yes --cleanup-tag || true

          gh release create android-latest \
            apks/sambramo-customer.apk \
            apks/sambramo-partner.apk \
            --title "Sambramo — Android test builds" \
            --notes "Debug builds from \`${{ github.sha }}\`.

**Install on an Android phone:** tap a link below, then allow the browser to install unknown apps when asked.

- [Sambramo (customer)](https://github.com/${{ github.repository }}/releases/download/android-latest/sambramo-customer.apk)
- [Sambramo Partners](https://github.com/${{ github.repository }}/releases/download/android-latest/sambramo-partner.apk)

Both apps load the live site, so a deploy reaches them without a new install. A new APK is only needed when something native changes — push, permissions, a plugin, the icon."

      - name: The links
        run: |
          echo "Customer: https://github.com/${{ github.repository }}/releases/download/android-latest/sambramo-customer.apk"
          echo "Partner:  https://github.com/${{ github.repository }}/releases/download/android-latest/sambramo-partner.apk"
