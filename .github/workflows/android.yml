name: Android APKs

on:
  workflow_dispatch:
  push:
    branches: [feature/without-shopping, earnings_ui_from_chatgpt]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/capacitor-config.mjs'
      - '.env.android'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: [customer, partner]

    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Write the Capacitor config
        run: node scripts/capacitor-config.mjs ${{ matrix.flavour }}
      - name: Build the web app
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SURFACE: ${{ matrix.flavour }}
          VITE_BUILD: ${{ github.sha }}
        run: |
          set -a; . ./.env.android; set +a
          npm run build
          node scripts/write-sw-config.mjs
          node scripts/write-version.mjs
          test -f dist/index.html
          grep -q '__FIREBASE_SW_CONFIG__' dist/firebase-messaging-sw.js && { echo 'service worker config was NOT baked'; exit 1; } || true
      - name: Open every screen
        run: |
          which google-chrome google-chrome-stable chromium 2>/dev/null || true
          node scripts/smoke-routes.mjs
      - name: Manifest is well-formed
        run: node scripts/check-android-manifest.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ matrix.flavour == 'customer' && 'Customer' || 'Partner' }}Debug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g"
      - name: Name it something a person can read
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" "out/sambramo-${{ matrix.flavour }}.apk"
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: sambramo-${{ matrix.flavour }}-apk
          path: out/*.apk
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          printf '{"build":"${{ github.sha }}","builtAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > apks/version.json
          gh release create android-latest apks/sambramo-customer.apk apks/sambramo-partner.apk apks/version.json --title "Sambramo — Android test builds" --notes "Earnings-tab UI build."
      - name: The links
        run: |
          echo "Partner: https://github.com/${{ github.repository }}/releases/download/android-latest/sambramo-partner.apk"
