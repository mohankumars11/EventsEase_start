name: Field validation tests

# Separate from android.yml on purpose: a red validation run must never
# stop an APK from being built, and the APK workflow must not change.
#
# Offline suites only: the rule matrix, the inventory check, the existing
# input-rule and referral checks, and the Selenium field lab against real
# components with a stub server. The database suites (server parity and
# direct writes, and the end-to-end journey) create throwaway partners on
# the only Supabase project there is, so they run locally; here they are
# reported as SKIPPED, never as passed.

on:
  workflow_dispatch:
  push:
    branches: [feature/trade-champion-referral-from-build145, refactor/sambramo-workbook-pricing-20260929]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/validation-tests.yml'

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rule matrix (every rule, every category that applies)
        run: node scripts/check-field-validation-matrix.mjs
      - name: Field inventory is complete
        run: node scripts/check-validation-inventory.mjs
      - name: Existing input rules
        run: node scripts/check-partner-input-rules.mjs
      - name: Referral lifecycle rules (SQL)
        run: node scripts/check-referral-lifecycle.mjs
      - name: Trade Champion model
        run: node scripts/check-trade-champion.mjs
      - name: Sambramo trade + questionnaire V2 contract
        run: node scripts/check-sambramo-v2.mjs
      - name: Regenerate generated catalogue IDs for reconciliation
        run: |
          node scripts/generate-catalogue-ids.mjs
          mkdir -p reports/generated
          cp src/data/catalogueIds.generated.js reports/generated/catalogueIds.generated.js
      - name: 34-trade generated catalogue integrity
        run: node scripts/check-sambramo-catalogue-v2.mjs
      - name: Sambramo 5B-5F regression + security gate
        run: node scripts/check-sambramo-5b-5f.mjs

      - name: Build the partner web app (for the harness stylesheet)
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SURFACE: partner
        run: |
          set -a; . ./.env.android; set +a
          npm run build

      - name: Selenium field lab (headless Chrome)
        env:
          BROWSER: chrome
        run: node tests/selenium/run.mjs lab

      - name: Database suites
        run: echo "Server parity, direct writes and the end-to-end journey run locally against the database; SKIPPED here."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: reports/
          retention-days: 14
