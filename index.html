<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Android status bar and the task-switcher card.
         White was right when the brand ground was navy and only the splash
         used it; now the launch screen, the app icon and the tab chip are
         all amethyst, and a white status bar above a purple splash is a
         seam across the top of the first screen anybody sees.
         #25034B is the launch artwork's own top edge, which is what the
         top of the screen actually shows. See the note in
         android/app/src/main/res/values/colors.xml for the whole chain. -->
    <meta name="theme-color" content="#25034B" />
    <!-- These two strings are the one place the brand lines can't be read from
         src/config/sambramo.js — this file is static and ships before any JS.
         They are copied from BRAND.tagline and BRAND.descriptor verbatim; if
         you change either there, change it here too. -->
    <meta name="description" content="Sambramo — Celebrations, arranged. Nothing left to chance. India's human-assisted concierge celebration service: tell us what you're celebrating and a real coordinator sources every vendor, negotiates, and brings back one clear price." />
    <!-- The launch screen font, fetched before the CSS that asks for it.

         This is the one face the app does NOT take from the CDN below. In
         the packaged Android build the HTML, CSS and JS are all local, so a
         CDN font is a network round trip on every cold start: the splash
         would paint the wordmark in a fallback and swap to the real cut
         mid animation. See the @font-face at the top of src/index.css. -->
    <link rel="preload" href="/fonts/ArchivoBlack-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The launch artwork. It is the entire first screen, so it is
         fetched ahead of the bundle that renders it; 81KB of WebP, written
         by scripts/render-splash-art.mjs, which crops brand/splash-source.png
         down to the illustration. The four lines of type on that screen are
         set live by SplashScreen.jsx, not baked into this file. -->
    <link rel="preload" href="/splash/splash-art-720.webp" as="image" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The ital axis matters: the hero's lead line is set in Playfair
         italic. src/index.css already imports it with italic, but this tag
         requested upright only — two disagreeing requests for the same
         family is how you end up with a browser-synthesised oblique instead
         of the real cut. Both now ask for the same thing. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Manrope:wght@400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet" />
    <title>Sambramo — Celebrations, arranged. Nothing left to chance.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
