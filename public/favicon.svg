<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The browser-tab mark.
       A standalone SVG cannot load a webfont, so this cannot be the
       Spencerian S the app draws — the app icons (icon-512.png,
       icon-maskable-512.png) are rendered from the real component instead.
       A favicon is 16px of tab furniture, where a hairline script letter
       would be mud regardless, so this is the initial in the wordmark's own
       serif with the brand's two colours. -->
  <rect width="64" height="64" rx="15" fill="#061448"/>
  <defs>
    <linearGradient id="g" x1="18" y1="12" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E3A8"/>
      <stop offset="50%" stop-color="#D9A445"/>
      <stop offset="100%" stop-color="#A8762B"/>
    </linearGradient>
  </defs>
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="44"
        font-style="italic" font-weight="700" fill="url(#g)">S</text>
</svg>
